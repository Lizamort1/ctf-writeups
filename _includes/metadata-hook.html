<style>
  /* EN - VN Language Switcher (Longhd style) */
  .lang-switch {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: 22px;
    margin: 10px 0 16px;
    user-select: none;
  }

  .lang-switch.topbar-lang-switch {
    margin: 0 16px 0 auto;
    gap: 16px;
  }

  .lang-btn {
    appearance: none;
    -webkit-appearance: none;
    border: 0;
    background: transparent;
    padding: 2px 4px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .5px;
    color: var(--text-color, #e0e0e0);
    opacity: .35;
    cursor: pointer;
    transition: opacity .18s ease, transform .12s ease;
    outline: none;
  }

  .lang-btn.active {
    opacity: 1 !important;
  }

  .lang-btn:hover {
    opacity: .85;
  }

  .lang-btn:active {
    transform: scale(.96);
  }

  .lang-btn:focus-visible {
    outline: 2px solid rgba(120, 120, 120, .3);
    border-radius: 4px;
  }

  /* Seamless instant switching */
  html[data-lang="en"] .lang-vn {
    display: none !important;
  }
  html[data-lang="en"] .lang-en {
    display: block !important;
  }

  html[data-lang="vn"] .lang-en {
    display: none !important;
  }
  html[data-lang="vn"] .lang-vn {
    display: block !important;
  }
</style>

<script>
  (function() {
    function setLanguage(lang) {
      const isVN = (lang === 'vn' || lang === 'vi');
      const targetLang = isVN ? 'vn' : 'en';

      document.documentElement.setAttribute('data-lang', targetLang);

      document.querySelectorAll('.lang-btn').forEach(function(btn) {
        const bLang = btn.getAttribute('data-lang');
        const isActive = (isVN && bLang === 'vn') || (!isVN && bLang === 'en');
        btn.classList.toggle('active', isActive);
        btn.setAttribute('aria-selected', String(isActive));
      });

      try {
        localStorage.setItem('site_lang_choice', targetLang);
      } catch (e) {}
    }

    window.setLanguage = setLanguage;

    // Apply saved language immediately to eliminate flash of unstyled content
    let savedLang = 'vn';
    try {
      savedLang = localStorage.getItem('site_lang_choice') || 'vn';
    } catch(e) {}
    document.documentElement.setAttribute('data-lang', savedLang);

    function initLangSwitch() {
      const current = document.documentElement.getAttribute('data-lang') || 'vn';

      // Inject language switcher into topbar if topbar exists and doesn't have one
      const topbar = document.getElementById('topbar');
      if (topbar && !topbar.querySelector('.topbar-lang-switch')) {
        const switchDiv = document.createElement('div');
        switchDiv.className = 'lang-switch topbar-lang-switch';
        switchDiv.setAttribute('role', 'tablist');
        switchDiv.setAttribute('aria-label', 'Language switch');
        switchDiv.innerHTML = '<button class="lang-btn' + (current === 'en' ? ' active' : '') + '" role="tab" type="button" data-lang="en" aria-selected="' + (current === 'en') + '">EN</button>' +
                              '<button class="lang-btn' + (current === 'vn' ? ' active' : '') + '" role="tab" type="button" data-lang="vn" aria-selected="' + (current === 'vn') + '">VN</button>';
        
        const trigger = document.getElementById('sidebar-trigger') || topbar.lastElementChild;
        if (trigger) {
          topbar.insertBefore(switchDiv, trigger);
        } else {
          topbar.appendChild(switchDiv);
        }
      }

      // Bind all lang buttons across document
      document.querySelectorAll('.lang-btn').forEach(function(btn) {
        const bLang = btn.getAttribute('data-lang');
        btn.classList.toggle('active', current === bLang);
        btn.setAttribute('aria-selected', String(current === bLang));

        if (!btn.dataset.langBound) {
          btn.dataset.langBound = 'true';
          btn.addEventListener('click', function(e) {
            e.preventDefault();
            setLanguage(this.getAttribute('data-lang'));
          });
        }
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initLangSwitch);
    } else {
      initLangSwitch();
    }
  })();
</script>
